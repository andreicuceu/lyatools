# DESI DR3 (matterhorn) Lya mocks: LyaCoLoRe skewers (existing), seed catalogs from the Lya coverage of the release,
# quickquasars with DLAs (DLA+), metals and BALs, catalogs, deltas and correlations.
# Needs a desisim with build_lya_coverage, --dlaplus and the quickquasars cleanup (see the README).

[job_info]
nersc_machine = perl
slurm_queue = regular
env_command = piccaenv
desi_env_command = mydesienv
no_submit = True

[control]
run_lyacolore = False
run_qq = True
run_zerr = True
run_pk1d = False
run_deltas = True
run_qsonic = False
run_corr = True
run_export = True
run_vega = False
# False: all the seed catalogs are made in one job (they are independent, about a minute and 1.7 GB each)
run_mocks_individually = False
stack_correlations = False

mock_analysis_type = continuum_fitted

[lyacolore]

[mock_setup]
# Existing LyaCoLoRe skewers (skewers_start_path/skewers_name/skewers_version/skewers-<seed>/master.fits)
skewers_start_path = /global/cfs/cdirs/desicollab/mocks/lya_forest/develop/lyacolore_2lpt
skewers_name = lyacolore_skewers
skewers_version = v3.0
# Where the mocks are stored. The Lya coverage goes to
#   <mock_start_path>/<survey_name>/<skewers_version>.<qq_version>/coverage/lya_<release>_coverage.fits
mock_start_path = /path/to/mocks
analysis_start_path = /path/to/analysis

mock_type = lyacolore
survey_name = qq_desi_dr3
qq_version = 6
# Seed ranges exclude the upper end: 0-10 is seeds 0 to 9
mock_seeds = 0-10
# Digits: 1 DLAs (with DLA+), 2 metals, 4 BALs (6 would drop the Lya absorption)
qq_run_type = matterhorn-124

[quickquasars]
slurm_hours = 1
nodes = 1
nproc = 96
release = matterhorn
input_data_catalog = /global/cfs/cdirs/desi/users/martini/QSO-Catalogs/QSO_cat_matterhorn_main_dark_healpix_v2.fits
metal_strengths = 0.1901 0.0697 0.0335 0.0187 1.3e-03 3.5e-03 0.7e-03 1.4e-03

# Selection of the seed catalogs (gen_qso_catalog):
#   randoms : footprint, completeness per target class (QSO and non-QSO targets) and exposure times in whole nominal passes (1000 s)
#             from the Lya coverage of the release, built from the LSS randoms. An existing coverage file is reused.
#   tiles   : previous method (tile circles of the release, thinning per NPASS class, exposure PDFs per NPASS)
selection_method = randoms
# LSS directory with rancomb_<k>dark*wdupspec_zdone.fits (needed only to build the coverage)
lss_randoms_dir = /global/cfs/cdirs/desi/survey/catalogs/DA3/LSS/matterhorn-v2
# Use an existing coverage instead of the default location / building one
# lya_coverage = /path/to/lya_matterhorn_coverage.fits
# Walltime [hours] and processes of the build job (about 2-4 minutes with 64 processes)
lya_coverage_hours = 0.5
lya_coverage_nproc = 64

# DLA catalog used for masking: log NHI > 20.3, quasar SNR > 2, 75% completeness, and only DLAs whose Lya is observed
# (1215.67 (1 + z_DLA) >= 3600 A; 0 masks them all, as the DR2 mocks did)
dla_mask_nhi_cut = 20.3
dla_mask_snr_cut = 2
dla_completeness = 0.75
dla_mask_lambda_min = 3600
masked_bal_qso = False
only_qso_targets = False

[inject_zerr]
distribution = gauss
amplitude = 400
zerr_in_deltas = False

[delta_extraction]
nproc = 64
slurm_hours_lya = 1.2
slurm_hours_lyb = 0.6
type = Dr16FixedFudgeExpectedFlux
delta_lambda = 0.8
lambda_min = 3600
lambda_max = 5772
lambda_rest_lya_min = 1040
lambda_rest_lya_max = 1205
lambda_rest_lyb_min = 920
lambda_rest_lyb_max = 1020
run_lya_region = True
run_lyb_region = True
force_stack_delta_to_zero = True
var_lss_mod = 7.5
num_pix_min = 150
max_num_spec = -1
mask_DLAs = True
mask_BALs = True

[qsonic]

[picca_Pk1D]

[picca_corr]
nproc = 128
cf_lya_lya_slurm_hours = 1.0
cf_lya_lyb_slurm_hours = 1.0
xcf_lya_qso_slurm_hours = 0.5
xcf_lyb_qso_slurm_hours = 0.5
dmat_lya_lya_slurm_hours = 7
dmat_lya_lyb_slurm_hours = 5
xdmat_lya_qso_slurm_hours = 1
xdmat_lyb_qso_slurm_hours = 0.5
run_auto = True
run_cross = True
run_lyb_region = True
compute_dmat = False
#use_preexisting_analysis_deltas = prev_run_tag
#z_min = 0.0
#z_max = 2.25
dmat_on_first_mock_only = False
compute_metals = False
no_compute_corr = False
rp_min = 0
rp_max = 200
rt_max = 200
num_bins_rp = 50
num_bins_rt = 50
dmat_rejection = 0.99
coeff_binning = 2
dmat_num_bins_rp = 75
dmat_rp_max = 300
fid_Or = 7.96641826260616E-05
fid_Om = 0.315191867993297
rebin_factor = 3
no_project = False
no_remove_mean_lambda_obs = False

[picca_export]
export-cov-slurm-hours = 1.0
